name: Automated Blog Generation

on:
  schedule:
    - cron: '30 2 * * *'  # 08:00 AM IST (Slot 0)
    - cron: '30 4 * * *'  # 10:00 AM IST (Slot 1)
    - cron: '30 6 * * *'  # 12:00 PM IST (Slot 2)
    - cron: '30 8 * * *'  # 02:00 PM IST (Slot 3)
    - cron: '30 10 * * *' # 04:00 PM IST (Slot 4)
    - cron: '30 12 * * *' # 06:00 PM IST (Slot 5)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot ID (0-5)'
        required: false
        default: '0'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Determine Slot ID
        id: slot
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "id=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            # Calculate slot based on UTC hour (2, 4, 6, 8, 10, 12)
            HOUR=$(date +%H)
            SLOT=$(( (HOUR - 2) / 2 ))
            echo "id=$SLOT" >> $GITHUB_OUTPUT
          fi

      - name: Generate Blog Post
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          npm run generate-blog -- --count=1 --slot=${{ steps.slot.outputs.id }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blogPosts.json
          git commit -m "🤖 Auto-generated blog post (Slot ${{ steps.slot.outputs.id }})" || echo "No changes to commit"
          git push origin main
