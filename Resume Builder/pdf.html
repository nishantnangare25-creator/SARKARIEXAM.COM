<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Craft - Your Resume</title>
    <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
    <link rel="stylesheet" href="/public/assets/css/pdf.css">
</head>

<body>

    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo">CV<span>Craft</span></div>
            <div class="loader-bar">
                <div class="loader-fill"></div>
            </div>
            <p>Preparing your resume...</p>
        </div>
    </div>

    <div class="top-bar">
        <div class="top-logo">CV<span>Craft</span></div>
        <div class="top-actions">
            <a href="/Resume Builder/index.html" class="btn-back-link">
                <i class="uil uil-arrow-left"></i> Back to Builder
            </a>
            <button class="btn-dl" id="download" onclick="downloadPDF()">
                <i class="uil uil-file-download"></i> Download PDF
            </button>
        </div>
    </div>

    <div class="note-bar">
        <i class="uil uil-info-circle"></i>
        Tap the circle photo area to upload your profile photo, then download PDF.
    </div>

    <div class="pdf-wrapper">
        <div id="invoice">
            <!-- Header -->
            <div class="rv-header">
                <div class="rv-photo" id="imgBox">
                    <input style="display:none" type="file" accept="image/*" id="file" onchange="loadFile(event)">
                    <label for="file" id="fileUpload"><i class="uil uil-camera"></i></label>
                </div>
                <div class="rv-header-info">
                    <h1 id="myname"></h1>
                    <p id="jobtitle" class="rv-subtitle"></p>
                    <div class="rv-contacts">
                        <span id="emailSpan"><i class="uil uil-envelope"></i> <span id="email"></span></span>
                        <span id="telSpan"><i class="uil uil-phone"></i> <span id="tel"></span></span>
                        <span id="locationSpan"><i class="uil uil-map-marker"></i> <span id="locationTxt"></span></span>
                    </div>
                    <div class="linkedin-row" id="linkedinRow">
                        <i class="uil uil-link" style="color:#6C63FF"></i>
                        <a id="linkedin" href="#" target="_blank"></a>
                    </div>
                </div>
            </div>

            <!-- Profile -->
            <div class="rv-section" id="profileSec">
                <div class="rv-section-title">Profile</div>
                <p id="profileText"></p>
            </div>

            <!-- Education -->
            <div class="rv-section">
                <div class="rv-section-title">Education</div>
                <div class="rv-edu-item" id="degreeItem">
                    <div class="rv-edu-head">
                        <strong id="degree"></strong>
                        <span id="degreeyear" class="rv-year"></span>
                    </div>
                    <div id="clgname" class="rv-edu-sub"></div>
                    <div id="degreepercent" class="rv-edu-grade"></div>
                </div>
                <div class="rv-edu-item" id="hscItem">
                    <div class="rv-edu-head">
                        <strong id="hsc"></strong>
                        <span id="hscyear" class="rv-year"></span>
                    </div>
                    <div id="sclname" class="rv-edu-sub"></div>
                </div>
            </div>

            <!-- Skills -->
            <div class="rv-section" id="skillsSec">
                <div class="rv-section-title">Skills</div>
                <div id="skillsWrap" class="rv-skills-wrap"></div>
                <div id="languagesWrap" class="rv-lang-wrap"></div>
            </div>

            <!-- Project -->
            <div class="rv-section" id="projectSec">
                <div class="rv-section-title">Project</div>
                <div class="rv-project">
                    <div class="rv-project-head">
                        <strong id="projectTitle"></strong>
                        <a id="projectURL" href="#" target="_blank"><i class="uil uil-external-link-alt"></i> View</a>
                    </div>
                    <p id="projectInfo"></p>
                </div>
            </div>

            <!-- Strengths -->
            <div class="rv-section" id="strengthSec">
                <div class="rv-section-title">Strengths</div>
                <ul class="rv-list">
                    <li id="li1"></li>
                    <li id="li2"></li>
                    <li id="li3"></li>
                </ul>
            </div>

            <!-- Hobbies -->
            <div class="rv-section" id="hobbySec">
                <div class="rv-section-title">Hobbies</div>
                <div id="hobbiesWrap" class="rv-hobbies-wrap"></div>
            </div>

            <!-- Achievements -->
            <div class="rv-section" id="achieveSec">
                <div class="rv-section-title">Achievements & Certifications</div>
                <p id="achievements"></p>
            </div>
        </div>
    </div>

    <script src="/public/assets/js/pdf.js"></script>
</body>

</html> 4
