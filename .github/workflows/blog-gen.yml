name: Blog Auto-Generate & Deploy

permissions:
  contents: write

on:
  schedule:
    # Run hourly
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab


jobs:
  generate-and-deploy:
    name: Generate Blog Posts & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AIGovPrep

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm install

    - name: Generate 1 New AI Blog Post
      run: |
        HOUR=$(date +%H)
        echo "Running for Hour slot: $HOUR"
        node scripts/generate-blog.js --count=1 --slot=$HOUR
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
        GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
        GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
        OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
        OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}

    - name: Check for new blog posts
      id: check_changes
      run: |
        git config --global user.name "Sarkari AI Bot"
        git config --global user.email "bot@sarkariexamai.com"
        git add src/data/blogPosts.json
        if git diff --staged --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit new blog posts
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git commit -m "chore(blog): auto-generate daily AI blog posts [skip ci]"
        git push

    - name: Build Project
      if: steps.check_changes.outputs.changed == 'true'
      run: npm run build

    - name: Install lftp
      if: steps.check_changes.outputs.changed == 'true'
      run: sudo apt-get install -y lftp

    - name: Deploy to MilesWeb via FTP
      if: steps.check_changes.outputs.changed == 'true'
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        # Write credentials to .netrc to avoid shell escaping issues
        echo "machine $FTP_SERVER login $FTP_USER password $FTP_PASS" > ~/.netrc
        chmod 600 ~/.netrc
        lftp -e "
          set ftp:ssl-allow no;
          set net:timeout 30;
          set net:max-retries 3;
          mirror --reverse --delete --verbose ./dist/ /public_html/;
          quit;
        " ftp://$FTP_SERVER