name: Deploy to MilesWeb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AIGovPrep

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Install lftp
      run: sudo apt-get install -y lftp

    - name: Deploy to MilesWeb via FTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        echo "machine $FTP_SERVER login $FTP_USER password $FTP_PASS" > ~/.netrc
        chmod 600 ~/.netrc
        lftp -e "
          set ftp:ssl-allow no;
          set net:timeout 30;
          set net:max-retries 3;
          mirror --reverse --delete --verbose ./AIGovPrep/dist/ /public_html/;
          quit;
        " ftp://$FTP_SERVER
