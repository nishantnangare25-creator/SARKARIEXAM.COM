name: Deploy to MilesWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AIGovPrep

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './AIGovPrep/package-lock.json'
          
      - name: 📦 Install Dependencies
        run: npm install
        
      - name: 🔨 Build Project
        run: npm run build
        env:
          VITE_GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          VITE_GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          VITE_GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          VITE_OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          VITE_OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          VITE_OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
        
      - name: 🚀 Install lftp
        run: sudo apt-get install -y lftp

      - name: 📁 Deploy to MilesWeb via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            open ftp://$FTP_SERVER;
            user \"$FTP_USER\" \"$FTP_PASS\";
            mirror --reverse --delete --continue --verbose ./dist/ /public_html/;
            quit;
          " 
