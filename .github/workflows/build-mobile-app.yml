name: Build Mobile App (Flutter)

on:
  push:
    paths:
      - 'Sarkari Exam AI App/**'
  workflow_dispatch: # Manual trigger from GitHub Actions tab

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Initialize Flutter Project
        run: |
          cd "Sarkari Exam AI App"
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp lib/main.dart /tmp/main_backup.dart
          # Changing the org to generate a totally fresh Android Application ID 
          flutter create --org com.sarkari.freshbuild --project-name sarkari_exam_ai_app . || true
          # Always restore our custom files
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          cp /tmp/main_backup.dart lib/main.dart
          echo "=== pubspec.yaml verified ==="
          cat pubspec.yaml

      - name: Configure AndroidManifest permissions
        run: |
          MANIFEST="Sarkari Exam AI App/android/app/src/main/AndroidManifest.xml"
          
          # Use safer sed substitution instead of append marker 'a \' which can cause XML syntax errors on Linux
          
          # INTERNET permission
          grep -q 'INTERNET' "$MANIFEST" || \
            sed -i 's|<manifest|<manifest\n    <uses-permission android:name="android.permission.INTERNET" />|' "$MANIFEST"

          # WRITE_EXTERNAL_STORAGE (Android 9 and below only)
          grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST" || \
            sed -i 's|<manifest|<manifest\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />|' "$MANIFEST"

          # READ_EXTERNAL_STORAGE (Android 9 and below only)
          grep -q 'READ_EXTERNAL_STORAGE' "$MANIFEST" || \
            sed -i 's|<manifest|<manifest\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="28" />|' "$MANIFEST"

          # Scoped storage for Android 10+ (no permission needed, but declare)
          grep -q 'requestLegacyExternalStorage' "$MANIFEST" || \
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' "$MANIFEST"

          # Allow cleartext traffic for local testing
          grep -q 'usesCleartextTraffic' "$MANIFEST" || \
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"

          echo "=== Updated AndroidManifest ==="
          cat "$MANIFEST"

      - name: Clean old cache
        run: |
          rm -rf /home/runner/.pub-cache/hosted/pub.dev/open_file_plus* || true
          cd "Sarkari Exam AI App"
          flutter clean

      - name: Install Dependencies
        run: |
          cd "Sarkari Exam AI App"
          flutter pub get
          echo "=== Package versions ==="
          flutter pub deps | grep -E "webview|open_file|permission|path_provider|launcher_icons"

      - name: Generate App Icons (from original logo)
        run: |
          cd "Sarkari Exam AI App"
          dart run flutter_launcher_icons
          echo "=== App icons generated ==="
          ls android/app/src/main/res/mipmap-*/ic_launcher.png 2>/dev/null || echo "Icons in place"

      - name: Build Release APK
        run: |
          cd "Sarkari Exam AI App"
          flutter build apk --release --no-shrink
          echo "=== APK Info ==="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SarkariExamAI-v1.0.8-v2
          path: "Sarkari Exam AI App/build/app/outputs/flutter-apk/app-release.apk"
          retention-days: 30
