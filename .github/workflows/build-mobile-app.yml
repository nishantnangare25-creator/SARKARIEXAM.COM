name: Build Native Android APK

on:
  push:
    paths:
      - 'SarkariExamNative/**'
      - '.github/workflows/build-mobile-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build with Gradle
        run: |
          cd SarkariExamNative
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project-id"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:fake123",
                  "android_client_info": { "package_name": "com.sarkari.exam" }
                },
                "api_key": [ { "current_key": "dummy-api-key" } ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarkariExamNative-Release
          path: SarkariExamNative/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
