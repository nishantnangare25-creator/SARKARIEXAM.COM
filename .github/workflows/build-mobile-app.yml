name: Build Native Android APK

on:
  push:
    paths:
      - 'SarkariExamNative/**'
      - '.github/workflows/build-mobile-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          cd SarkariExamNative
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarkariExamNative-Release
          path: SarkariExamNative/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
