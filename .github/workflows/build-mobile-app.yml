name: Build Native Android APK

on:
  push:
    paths:
      - 'SarkariExamKotlin/**'
      - '.github/workflows/build-mobile-app.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build with Gradle
        run: |
          cd SarkariExamKotlin
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarkariExamNative-Debug
          path: SarkariExamKotlin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
