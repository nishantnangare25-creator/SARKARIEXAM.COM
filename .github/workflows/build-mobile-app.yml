name: Build Mobile App (Flutter)

on:
  push:
    paths:
      - 'Sarkari Exam AI App/**' # Only run when mobile app files change
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter Project (preserve pubspec.yaml)
        run: |
          cd "Sarkari Exam AI App"
          # Backup our custom pubspec.yaml BEFORE flutter create can touch it
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          # Initialize missing Android/iOS platform files
          flutter create --org com.sarkariexamai --project-name sarkari_exam_ai_app . || true
          # Always restore our custom pubspec.yaml (removes any open_file_plus reference)
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          echo "=== Verified pubspec.yaml (must show open_file, NOT open_file_plus) ==="
          cat pubspec.yaml

      - name: Remove any cached open_file_plus to prevent old dependency conflicts
        run: |
          rm -rf /home/runner/.pub-cache/hosted/pub.dev/open_file_plus* || true
          echo "Cleaned old open_file_plus cache"

      - name: Configure Android Permissions (Internet)
        run: |
          cd "Sarkari Exam AI App/android/app/src/main"
          # Insert uses-permission before the <application> tag (only if not already there)
          grep -q 'android.permission.INTERNET' AndroidManifest.xml || \
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' AndroidManifest.xml
          # Add cleartextTrafficPermitted (only if not already there)
          grep -q 'usesCleartextTraffic' AndroidManifest.xml || \
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' AndroidManifest.xml

      - name: Clean and Install Dependencies
        run: |
          cd "Sarkari Exam AI App"
          flutter clean
          flutter pub get
          echo "=== Dependencies installed ==="
          flutter pub deps | head -30

      - name: Build APK
        run: |
          cd "Sarkari Exam AI App"
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarkari-exam-ai-android-apk
          path: "Sarkari Exam AI App/build/app/outputs/flutter-apk/app-release.apk"

  build-ios:
    name: Build iOS (No Sign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter Project (preserve pubspec.yaml)
        run: |
          cd "Sarkari Exam AI App"
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --org com.sarkariexamai --project-name sarkari_exam_ai_app . || true
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          echo "=== Verified pubspec.yaml ==="
          cat pubspec.yaml

      - name: Configure iOS Permissions
        run: |
          cd "Sarkari Exam AI App/ios/Runner"
          grep -q 'NSAppTransportSecurity' Info.plist || \
          sed -i '' 's/<dict>/<dict><key>NSAppTransportSecurity<\/key><dict><key>NSAllowsArbitraryLoads<\/key><true\/><\/dict>/' Info.plist

      - name: Clean and Install Dependencies
        run: |
          cd "Sarkari Exam AI App"
          flutter clean
          flutter pub get

      - name: Build iOS App
        run: |
          cd "Sarkari Exam AI App"
          flutter build ios --release --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarkari-exam-ai-ios-build
          path: "Sarkari Exam AI App/build/ios/iphoneos/Runner.app"
