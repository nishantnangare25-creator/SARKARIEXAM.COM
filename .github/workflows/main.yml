name: Deploy to MilesWeb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './AIGovPrep/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: ./AIGovPrep
        run: npm install
        
      - name: 🔨 Build Project
        working-directory: ./AIGovPrep
        run: npm run build
        
      - name: 🚀 Sync files to FTP (LFTP)
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          localDir: "./AIGovPrep/dist"
          remoteDir: "./"
