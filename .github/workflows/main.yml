name: Deploy to MilesWeb

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './AIGovPrep/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: ./AIGovPrep
        run: npm install
        
      - name: 🔨 Build Project
        working-directory: ./AIGovPrep
        run: npm run build
        
      - name: 🚀 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sarkariexamai.com
          username: 253@sarkariexamai.com
          password: "30nW=+YeE&G!m2&4"
          local-dir: ./AIGovPrep/dist/
          server-dir: ./
